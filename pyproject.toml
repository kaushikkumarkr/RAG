[project]
name = "rag-foundry"
version = "0.1.0"
description = "Local-first Advanced RAG Platform"
authors = [{name = "Antigravity", email = "bot@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.3.0",
    "rank-bm25>=0.2.2",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3.31,<0.4",
    "langchain-openai>=0.3.35,<0.4",
    "langfuse>=2.0.0,<3.0.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "ragas>=0.2.15,<0.3",
    "mcp>=1.29.0,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.0.0"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
